<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Spice Delight</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      width: 360px;
    }
    .brand {
      font-size: 28px;
      font-weight: 700;
      color: #e74c3c;
      text-align: center;
      margin-bottom: 4px;
    }
    .brand-sub {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .btn-login {
      background: #e74c3c;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .btn-login:hover { background: #c0392b; }
    .form-control:focus { border-color: #e74c3c; box-shadow: 0 0 0 0.2rem rgba(231,76,60,.2); }
  </style>
</head>
<body>
  <div class="card p-4">
    <div class="brand">🍽️ Spice Delight</div>
    <div class="brand-sub">Welcome back! Please login.</div>

    <!-- Show error message if login failed -->
    {% if error %}
      <div class="alert alert-danger py-2 text-center" style="font-size:13px">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@email.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-login btn-danger w-100 mt-2">Login</button>
    </form>

    <p class="text-center mt-3 mb-0" style="font-size:13px; color:#888">
      New here? <a href="/signup" class="text-danger fw-semibold">Create an account</a>
    </p>
  </div>
</body>
</html>
