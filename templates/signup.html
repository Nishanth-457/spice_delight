<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Spice Delight</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --cream:#F7F3EE; --dark:#1C1917; --muted:#78716C; --accent:#C4783C; --border:#E5DDD5; }
    body { background:var(--cream); min-height:100vh; display:grid; grid-template-columns:1fr 1fr; font-family:'Jost',sans-serif; }
    .left-panel { background:var(--dark); position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:48px; }
    .left-panel::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 70% 20%,rgba(196,120,60,.12) 0%,transparent 60%); }
    .left-panel-text { position:relative; z-index:2; }
    .tagline { font-family:'Cormorant Garamond',serif; font-size:52px; font-weight:300; color:#fff; line-height:1.1; }
    .tagline em { font-style:italic; color:var(--accent); }
    .left-panel-text p { margin-top:16px; font-size:13px; font-weight:300; color:rgba(255,255,255,.4); letter-spacing:.5px; }
    .deco { position:absolute; border-radius:50%; border:1px solid rgba(196,120,60,.12); }
    .deco-1 { width:350px; height:350px; top:-100px; left:-100px; }
    .deco-2 { width:200px; height:200px; bottom:80px; right:-60px; }
    .right-panel { display:flex; align-items:center; justify-content:center; padding:48px; animation:fadeUp .6s ease forwards; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .form-box { width:100%; max-width:380px; }
    .brand { font-family:'Cormorant Garamond',serif; font-size:15px; font-weight:500; letter-spacing:3px; text-transform:uppercase; color:var(--accent); margin-bottom:40px; }
    h1 { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:300; color:var(--dark); letter-spacing:-0.5px; margin-bottom:8px; }
    .subtitle { font-size:13px; font-weight:300; color:var(--muted); margin-bottom:36px; }
    .error-msg { background:#FEF2F2; border:1px solid #FECACA; color:#B91C1C; font-size:12px; padding:10px 14px; border-radius:4px; margin-bottom:20px; }
    .form-group { margin-bottom:20px; }
    label { display:block; font-size:11px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    input { width:100%; border:none; border-bottom:1px solid var(--border); background:transparent; padding:10px 0; font-size:15px; font-family:'Jost',sans-serif; font-weight:300; color:var(--dark); outline:none; transition:border-color .2s; }
    input:focus { border-bottom-color:var(--accent); }
    input::placeholder { color:var(--border); }
    .btn { width:100%; margin-top:32px; padding:16px; background:var(--dark); color:#fff; border:none; font-family:'Jost',sans-serif; font-size:12px; font-weight:500; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:background .2s; }
    .btn:hover { background:var(--accent); }
    .bottom-link { margin-top:24px; text-align:center; font-size:12px; font-weight:300; color:var(--muted); }
    .bottom-link a { color:var(--accent); text-decoration:none; font-weight:500; }
    .divider { display:flex; align-items:center; gap:12px; margin:28px 0; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .divider span { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
    @media(max-width:768px){ body{grid-template-columns:1fr} .left-panel{display:none} }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="deco deco-1"></div>
    <div class="deco deco-2"></div>
    <div class="left-panel-text">
      <div class="tagline">Begin your<br><em>culinary</em><br>journey.</div>
      <p>Join thousands who dine with us.</p>
    </div>
  </div>
  <div class="right-panel">
    <div class="form-box">
      <div class="brand">Spice Delight</div>
      <h1>Create account.</h1>
      <p class="subtitle">Join us and start ordering today.</p>
      {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
      <form method="POST" action="/signup">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn">Create Account</button>
      </form>
      <div class="divider"><span>or</span></div>
      <p class="bottom-link">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </div>
</body>
</html>
